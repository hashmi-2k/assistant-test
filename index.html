<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASSAF Assistant — Test Page</title>
<style>
  body {
    font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
    background: #fafafa;
    background-image: linear-gradient(#f0f0f0 1px, transparent 1px), linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .note {
    position: fixed; top: 16px; left: 16px; font-size: 13px; color: #999;
    font-family: system-ui, sans-serif;
  }
  .lang-switch { position: fixed; top: 16px; right: 16px; font-size: 13px; }
  .lang-switch a { color: #b08a3e; text-decoration: none; margin: 0 4px; }
</style>
</head>
<body>
  <div class="note">Test page — loads the SAME widget as production ↘</div>
  <div class="lang-switch">
    Test as:
    <a href="?lang=ar" onclick="document.documentElement.lang='ar';return true;">العربية</a> |
    <a href="?lang=en" onclick="document.documentElement.lang='en';return true;">English</a>
  </div>

  <!-- Simulate the store's page language so the widget's auto-detect can be tested.
       (On the real store, Salla sets <html lang> itself.) -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get("lang");
      if (p === "en") { document.documentElement.setAttribute("lang", "en"); document.documentElement.setAttribute("dir", "ltr"); }
      else { document.documentElement.setAttribute("lang", "ar"); document.documentElement.setAttribute("dir", "rtl"); }
    })();
  </script>

  <!-- Load the exact same widget file production uses. Update assaf-widget.js once,
       and both this test page AND the live store get the change. -->
  <script src="https://hashmi-2k.github.io/assistant-test/assaf-widget.js" defer></script>
</body>
</html>
